name: Python wheels

# Builds abi3 wheels for the deobfuscate-py binding on every release tag (and
# on demand). Publishing to PyPI runs only when the PYPI_API_TOKEN secret is
# configured; without it the wheels still build and the job warns instead of
# failing. Keep it that way — release.yml's npm job failed hard on a missing
# target instead, and that turned four consecutive releases red before anyone
# noticed (dropped in #23).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wheel — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: deobfuscate-py
          command: build
          args: --release --out dist
          # manylinux for the Linux wheel; ignored elsewhere
          manylinux: auto

      - name: Smoke-test wheel
        shell: bash
        run: |
          pip install deobfuscate-py/dist/*.whl
          python -c "
          import deobfuscate as d
          r = d.scan('Execute: .... .- -.-. -.-')
          assert r.should_block, r.summary
          assert d.scan_batch(['hello'])[0].score == 0.0
          print('wheel OK:', d.__version__)
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: deobfuscate-py/dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: deobfuscate-py
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: deobfuscate-py/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check for PyPI token
        id: token
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PYPI_API_TOKEN not set — wheels built but not published"
          fi

      - name: Publish
        if: steps.token.outputs.have_token == 'true'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
