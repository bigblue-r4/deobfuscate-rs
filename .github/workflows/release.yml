name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: tests + clippy must pass before any publish step runs
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo clippy --all-features -- -D warnings

  publish-crate:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-wasm:
    name: Build WASM artifacts
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        # Pinned release, checked against its published sha256 (no curl | sh).
        env:
          WASM_PACK_VERSION: v0.15.1
          WASM_PACK_SHA256: 410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
        run: |
          name="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/$name.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          wasm-pack --version
      - name: Build WASM package
        # wasm-pack's own flags must come before the `--` separator; everything
        # after it is forwarded to cargo. The --scope flag only names the
        # generated package.json now that nothing publishes it to npm; it is
        # kept so the release artifacts stay byte-comparable with earlier tags.
        run: wasm-pack build --target web --out-dir pkg --scope bigblue-r4 -- --features wasm --no-default-features
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: pkg/

  create-release:
    name: Create GitHub Release
    needs: [publish-crate, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download WASM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: pkg/
      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the block between this version header and the next
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            pkg/deobfuscate.js
            pkg/deobfuscate_bg.wasm
            pkg/deobfuscate.d.ts
