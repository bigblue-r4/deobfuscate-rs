name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test — stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (default features)
        run: cargo test --all-features

      - name: cargo test (no default features)
        run: cargo test --no-default-features

  wasm:
    name: Check — wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (wasm32, wasm feature, no default features)
        run: cargo check --target wasm32-unknown-unknown --features wasm --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings

  python:
    name: Python binding — build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          pip install maturin
          maturin build --release --out dist -m deobfuscate-py/Cargo.toml
          pip install dist/*.whl

      - name: Smoke test
        run: |
          python -c "
          import deobfuscate as d
          r = d.scan('Execute: .... .- -.-. -.-')
          assert r.should_block, r.summary
          s = d.Scanner(config_toml='block_threshold = 0.95', disable=['morse-code'])
          assert not s.scan('Execute: .... .- -.-. -.-').is_obfuscated
          print('python binding OK:', d.__version__)
          "

  nostd:
    name: Check — no_std (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable toolchain + thumbv7em target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: cargo check (no_std + alloc, core passes only)
        run: cargo check --target thumbv7em-none-eabi --no-default-features

  semver:
    name: Semver — no accidental breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cargo-semver-checks vs latest published release
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: default-features

  fuzz-smoke:
    name: Fuzz smoke — 60s per target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + fuzz target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz analyze
        run: cargo +nightly fuzz run analyze -- -max_total_time=60

      - name: Fuzz config_toml
        run: cargo +nightly fuzz run config_toml -- -max_total_time=60
