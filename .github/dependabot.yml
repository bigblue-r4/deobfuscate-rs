version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action step in a workflow must run the same
      # version, so update init, analyze and upload-sarif together.
      codeql-action:
        patterns: ["github/codeql-action*"]
