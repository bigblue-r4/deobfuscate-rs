[workspace]
members = ["deobfuscate-py"]
exclude = ["fuzz"]

[package]
name        = "deobfuscate"
version     = "1.18.0"
edition     = "2021"
description = "Multi-pass text deobfuscation and encoding-evasion detector for LLM security pipelines."
license     = "MIT"
repository  = "https://github.com/bigblue-r4/deobfuscate-rs"
keywords    = ["security", "unicode", "homoglyph", "obfuscation", "llm"]
categories  = ["text-processing", "encoding"]
readme      = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "serde", "audit"]
# std: filesystem config loading, timestamps, and the SkeletonMatch pass
# (unicode_skeleton is std-only). Disable for no_std + alloc targets — see
# the "no_std / minimal profile" section of the README.
std     = ["dep:unicode_skeleton", "base64/std", "unicode-normalization/std", "serde?/std", "sha2?/std", "serde_json?/std"]
serde   = ["std", "dep:serde", "dep:toml"]
audit   = ["serde", "dep:sha2", "dep:serde_json", "dep:hmac"]
wasm    = ["std", "dep:wasm-bindgen", "dep:js-sys"]
# semantic: opt-in SemanticScorer trait hook + PhraseOverrideScorer reference
# implementation. No dependencies; zero cost when disabled.
semantic = []
# otel: OpenTelemetry span/event export per analysis (API crate only — bring
# your own SDK/exporter). Heavy-ish dep, strictly opt-in.
otel = ["std", "dep:opentelemetry"]

[dependencies]
base64                = { version = "0.22", default-features = false, features = ["alloc"] }
unicode-normalization = { version = "0.1", default-features = false }
unicode-security      = "0.1"
unicode_skeleton      = { version = "0.1", optional = true }
libm         = "0.2"
serde        = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
toml         = { version = "1.1", optional = true }
sha2         = { version = "0.10", default-features = false, optional = true }
hmac         = { version = "0.12", optional = true }
serde_json   = { version = "1", default-features = false, features = ["alloc"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys       = { version = "0.3", optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"], optional = true }

# Documented 1.x semver policy (see BREAKING-CANDIDATES.md): PassKind gains
# variants and Config gains fields in minor releases; downstream code uses a
# `_` match arm and `..Config::default()` respectively. Everything else stays
# at deny.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "warn"
constructible_struct_adds_field = "warn"

[[example]]
name = "audit"
required-features = ["audit"]

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "deobfuscate_bench"
harness = false
