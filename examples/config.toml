# deobfuscate — example configuration
# All fields are optional. Missing fields fall back to documented defaults.
# Load with: Config::try_from_file(Path::new("config.toml"))?
# Unknown fields and invalid values are rejected as parse errors.
# Ranges are validated: weights/thresholds in 0.0..=1.0, percentages <= 100.

# ── Decision thresholds ──────────────────────────────────────────────────────
flag_threshold  = 0.25   # score >= this → should_flag() (default 0.25)
block_threshold = 0.60   # score >= this → should_block() (default 0.60)

# ── CjkSuperposition ─────────────────────────────────────────────────────────
cjk_super_threshold    = 0.55   # entropy threshold for spike detection
# cjk_super_window       = 6
# cjk_super_min_cjk_frac = 0.40

# ── Per-pass weights ─────────────────────────────────────────────────────────
# Tighten homoglyph weight for high-sensitivity deployments
weight_homoglyph = 0.70

# Relax leet for gaming contexts where 1337 is normal
weight_leet = 0.10
leet_min_pct = 60

# ── EntropyBigram vocabulary override ────────────────────────────────────────
# Domain letter pairs (exactly two ASCII letters each, case-insensitive) merged
# with the built-in ~130-entry English bigram table. Use when domain vocabulary
# (genomics, legal acronyms, ...) trips low-coverage false positives.
# extra_english_bigrams = ["gt", "cg", "aa"]
#
# Per-script tables: tokens are scored against the bigram table of their
# dominant script (built-in tables: English/Latin, Cyrillic, Greek, Arabic).
# Each extra entry must be exactly two alphabetic characters of that script.
# extra_cyrillic_bigrams = ["юз"]
# extra_greek_bigrams    = ["γκ"]
# extra_arabic_bigrams   = ["پی"]

# ── Other tunable thresholds ─────────────────────────────────────────────────
# entropy_high        = 5.2    # Shannon entropy (bits) above which a token is suspicious
# entropy_min_english = 0.15   # English bigram coverage below which a token is suspicious
# url_min_run         = 3      # minimum consecutive %XX bytes to trigger
# html_min_entities   = 4      # minimum entity count before HTML pass fires
# base64_min_len      = 12
# morse_min_span      = 10
# morse_min_morse_pct = 60

# ── SemanticAnomaly (feature = "semantic") ───────────────────────────────────
# Only used when a SemanticScorer is installed via with_semantic_scorer().
# semantic_threshold = 0.50   # scorer output at/above this records a detection
# weight_semantic    = 0.60   # score weight for semantic-anomaly detections

# ── Audit trail (feature = "audit") ──────────────────────────────────────────
# Redaction for DetectionRecord.detail — the only audit field that can embed
# decoded snippets. "none" (default) | "hash" (sha256 of content) | "elide".
# audit_redaction = "hash"
