# Include optional Rust, Python, WASM, and telemetry dependencies on all targets.
[graph]
all-features = true

[advisories]
# Vulnerabilities fail cargo-deny by default; do not suppress any advisory.
ignore = []
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
